<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de IA - STARCONTRACT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        .chat-container { height: 100%; display: flex; flex-direction: column; }
        /* Toggle system-instruction styles */
        .system-wrapper { transition: max-height 0.22s ease, padding 0.18s ease; overflow: hidden; max-height: 120px; }
        .system-wrapper.collapsed { max-height: 42px; } /* espacio reducido cuando está colapsado */
        .system-toggle-btn { background: transparent; border: 1px solid transparent; padding: 6px 8px; border-radius: 8px; color: #4b5563; }
        .system-toggle-btn:hover { background: rgba(99,102,241,0.08); color: #374151; }
        .system-toggle-label { font-size: 0.875rem; color: #374151; margin-bottom: 0.25rem; display:flex; align-items:center; gap:8px; }
        .chat-header { background-color: #0d1117; border-bottom: 1px solid #30363d; color: white; }
        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .messages-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .message { max-width: 85%; padding: 0.75rem 1rem; border-radius: 1.5rem; margin-bottom: 1rem; position: relative; animation: fadeIn 0.3s ease-out; word-wrap: break-word; }
        .user-message { background-color: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 0.5rem; }
        .bot-message { background-color: #f1f5f9; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .bot-message pre { background-color: #1f2937; color: #d1d5db; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; }
        .bot-message code { font-family: 'Courier New', Courier, monospace; }
        .bot-message table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .bot-message th, .bot-message td { border: 1px solid #d1d5db; padding: 0.5rem; text-align: left; }
        .bot-message th { background-color: #e5e7eb; }
        .bot-message ul, .bot-message ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        .loading-dot { width: 10px; height: 10px; background-color: #94a3b8; border-radius: 50%; display: inline-block; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .loading-dot:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #mic-btn.recording { color: #ef4444; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 0.5rem; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        /* Estilos del nuevo textarea para que se auto-expanda */
        .chat-input-textarea {
            resize: none;
            min-height: 48px; /* Altura mínima inicial igual al botón */
            max-height: 200px; /* Altura máxima para evitar que ocupe toda la pantalla */
            font-size: 1rem;
            line-height: 1.5; /* Espaciado de línea normal */
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
            transition: height 0.2s ease-out; /* Transición suave para la expansión */
        }
        @media (max-width: 640px) {
            .chat-input-textarea { font-size: 1.02rem; padding-top: 0.6rem; padding-bottom: 0.6rem; }
            .chat-container { border-radius: 0; }
        }
        /* Ajustar el contenedor de botones para que los botones floten correctamente sobre el textarea */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end; /* Alinear los elementos al final (fondo) */
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="chat-container bg-white rounded-2xl shadow-xl overflow-hidden h-screen">
        <div class="chat-header p-4 flex items-center justify-between rounded-t-2xl">
            <h1 class="text-xl font-bold flex items-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 4v-4z" /></svg>Asistente STARCONTRACT</h1>
            <div class="flex items-center space-x-4">
                <button id="export-chat-btn" title="Exportar conversación" class="text-gray-400 hover:text-white transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg></button>
                <button id="clear-chat-btn" title="Limpiar conversación" class="text-gray-400 hover:text-white transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
            </div>
        </div>
        <div id="messages" class="messages-container flex-1 p-6 overflow-y-auto flex flex-col space-y-4"></div>
        <form id="chat-form" class="p-4 border-t border-gray-200">
            <!-- Contenedor del input/textarea mejorado para soportar la expansión -->
            <div class="input-wrapper relative">
                <button type="button" id="load-template-btn" title="Cargar plantilla" class="absolute left-3 bottom-3 text-gray-500 hover:text-indigo-600 z-10"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg></button>
                
                <!-- REEMPLAZO DEL INPUT POR TEXTAREA -->
                <textarea id="user-input" placeholder="Escribe tu pregunta legal..."
                    class="chat-input-textarea flex-1 w-full pl-12 pr-28 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition duration-200"
                    rows="1" required></textarea>
                <!-- FIN REEMPLAZO -->
                
                <!-- Los botones ahora están posicionados en la parte inferior derecha -->
                <button type="button" id="mic-btn" title="Dictar por voz" class="absolute right-16 bottom-3 text-gray-500 hover:text-indigo-600 z-10"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg></button>
                <button type="submit" id="send-button" class="absolute right-3 bottom-2 bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md active:scale-95 z-10"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg></button>
            </div>

            <!-- Instrucciones del sistema eliminadas por decisión del usuario -->

            <div id="status-message" class="text-xs text-gray-500 mt-2"></div>
        </form>
    </div>

    <div id="template-modal" class="modal-backdrop hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messagesContainer = document.getElementById('messages');
            const form = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input'); // Ahora es un textarea
            const statusMessage = document.getElementById('status-message');
            const clearChatBtn = document.getElementById('clear-chat-btn');
            const exportChatBtn = document.getElementById('export-chat-btn');
            const micBtn = document.getElementById('mic-btn');
            const loadTemplateBtn = document.getElementById('load-template-btn');
            const templateModal = document.getElementById('template-modal');
            const welcomeMessage = "¡Hola! Soy el asistente Legal de STARCONTRACT. ¿En qué puedo ayudarte hoy?";

            let chatHistory = [];
            let recognition;

            // Función para auto-expandir el textarea
            function autoExpandTextarea() {
                // 1. Resetear la altura a 'auto' para que el scrollHeight se calcule correctamente
                userInput.style.height = 'auto';
                
                // 2. Calcular la nueva altura: usa el scrollHeight (contenido total) pero respeta el max-height del CSS (200px)
                const newHeight = userInput.scrollHeight;
                const maxHeight = 200; // Coincide con el CSS
                
                if (newHeight > maxHeight) {
                    userInput.style.height = `${maxHeight}px`;
                    userInput.style.overflowY = 'auto'; // Mostrar scrollbar si se alcanza el máximo
                } else {
                    userInput.style.height = `${newHeight}px`;
                    userInput.style.overflowY = 'hidden'; // Ocultar scrollbar si no se necesita
                }
            }

            // Asignar el evento de input al textarea
            userInput.addEventListener('input', autoExpandTextarea);

            // Persistencia simple: guardar/recuperar historial en localStorage
            function saveChatHistory() {
                try {
                    // No guardamos el welcome message, sólo los mensajes reales
                    localStorage.setItem('chat_history', JSON.stringify(chatHistory));
                } catch (e) {
                    console.error('Error saving chat history:', e);
                }
            }

            function loadChatHistory() {
                try {
                    const stored = localStorage.getItem('chat_history');
                    if (!stored) return false;
                    const parsed = JSON.parse(stored);
                    if (!Array.isArray(parsed) || parsed.length === 0) return false;
                    chatHistory = parsed;
                    messagesContainer.innerHTML = '';
                    // Renderizar mensajes guardados
                    chatHistory.forEach(item => {
                        const text = item?.parts?.[0]?.text || '';
                        displayMessage(text, item.role === 'user');
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    return true;
                } catch (e) {
                    console.error('Error loading chat history:', e);
                    return false;
                }
            }

            function displayMessage(text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                const textDiv = document.createElement('div');
                if (isUser) {
                    textDiv.textContent = text;
                } else {
                    textDiv.innerHTML = marked.parse(text);
                }
                messageDiv.appendChild(textDiv);
                
                if (!isUser) {
                    messageDiv.classList.add('group');
                    const copyBtn = document.createElement('button');
                    copyBtn.title = "Copiar texto";
                    // Uso de document.execCommand('copy') como fallback seguro en iframes
                    copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500 hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>`;
                    copyBtn.className = "absolute top-2 right-2 p-1 rounded-full bg-white/20 hover:bg-white/40 opacity-0 group-hover:opacity-100 transition-opacity duration-200";
                    copyBtn.onclick = () => {
                        const tempTextarea = document.createElement('textarea');
                        tempTextarea.value = text;
                        document.body.appendChild(tempTextarea);
                        tempTextarea.select();
                        try {
                            const successful = document.execCommand('copy');
                            showStatus(successful ? "Texto copiado." : "Error al copiar.", successful ? 'green' : 'red');
                        } catch (err) {
                            showStatus("Error al copiar (execCommand fallback).", 'red');
                        }
                        document.body.removeChild(tempTextarea);
                    };
                    messageDiv.appendChild(copyBtn);

                    const createTplBtn = document.createElement('button');
                    createTplBtn.title = "Crear plantilla desde este texto";
                    createTplBtn.innerHTML = `<span class="flex items-center justify-center text-sm font-medium"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Crear Plantilla</span>`;
                    createTplBtn.className = "absolute top-2 right-10 px-3 py-1 rounded-full bg-indigo-500 text-white hover:bg-indigo-600 transition-all duration-200 shadow-md opacity-0 group-hover:opacity-100";
                    createTplBtn.onclick = async () => {
                        const filename = prompt("Introduce el nombre para la nueva plantilla (debe terminar en .md):", "plantilla-generada.md");
                        if (!filename || !filename.endsWith('.md')) {
                            if(filename) showStatus("Nombre de archivo no válido. Debe terminar en .md", "red");
                            return;
                        }
                        const token = localStorage.getItem('access_token');
                        if (!token) { return showStatus("Error de autenticación. Por favor, inicie sesión de nuevo.", "red"); }
                        try {
                            const response = await fetch('/create-template-from-ia', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify({ filename, content: text })
                            });
                            const result = await response.json();
                            if (!response.ok) throw new Error(result.detail || 'Error al crear la plantilla.');
                            showStatus(result.message, 'green');
                            const manageTab = window.parent.document.getElementById('manage-tab');
                            if (manageTab && manageTab.classList.contains('active')) {
                                window.parent.document.getElementById('refresh-templates').click();
                            }
                        } catch (error) {
                            showStatus(error.message, 'red');
                        }
                    };
                    messageDiv.appendChild(createTplBtn);
                }
                
                messagesContainer.appendChild(messageDiv);
                if (!isUser) {
                    const codeBlocks = messageDiv.querySelectorAll('pre code');
                    codeBlocks.forEach((block) => { hljs.highlightElement(block); });
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function showStatus(message, color, duration = 3000) {
                statusMessage.textContent = message;
                statusMessage.style.color = color;
                if (duration > 0) {
                    setTimeout(() => statusMessage.textContent = "", duration);
                }
            }

            function clearChat() {
                messagesContainer.innerHTML = '';
                chatHistory = [];
                // Borrar almacenamiento persistente
                try { localStorage.removeItem('chat_history'); } catch(e){}
                displayMessage(welcomeMessage);
                // Asegurar que el textarea vuelva a su altura inicial
                userInput.value = '';
                autoExpandTextarea();
            }

            function exportChat() {
                const chatText = Array.from(messagesContainer.children).map(msg => {
                    const isUser = msg.classList.contains('user-message');
                    const prefix = isUser ? '**Usuario:**' : '**Asistente:**';
                    // Usar textContent para obtener el texto limpio sin Markdown
                    const content = msg.querySelector('div').textContent.trim(); 
                    return `${prefix}\n\n${content}`;
                }).join('\n\n---\n\n');

                const blob = new Blob([chatText], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chat-starcontract-${new Date().toISOString().slice(0,10)}.md`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus("Chat exportado.", 'green');
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'es-CO';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                micBtn.addEventListener('click', () => {
                    if (micBtn.classList.contains('recording')) {
                        recognition.stop();
                    } else {
                        try {
                            recognition.start();
                        } catch(e) {
                            showStatus("El reconocimiento de voz ya está activo.", "orange");
                        }
                    }
                });

                recognition.onstart = () => {
                    micBtn.classList.add('recording');
                    showStatus('Escuchando...', '#6366f1', 0);
                };
                recognition.onresult = (event) => {
                    userInput.value += event.results[0][0].transcript;
                    autoExpandTextarea(); // Llamar a la expansión después de agregar texto
                };
                recognition.onspeechend = () => recognition.stop();
                recognition.onend = () => {
                    micBtn.classList.remove('recording');
                    showStatus("", "");
                };
                recognition.onerror = (event) => {
                    const errorMsg = event.error == 'not-allowed' ? "Permiso de micrófono denegado." : `Error de voz: ${event.error}`;
                    showStatus(errorMsg, 'red', 10000);
                };
            } else {
                micBtn.style.display = 'none';
            }

            async function openTemplateModal() {
                const token = localStorage.getItem('access_token');
                if (!token) { return showStatus("Error de autenticación.", "red"); }
                try {
                    const response = await fetch('/templates-list/md', { headers: { 'Authorization': `Bearer ${token}` } });
                    const result = await response.json();
                    if (!response.ok || !result.success) throw new Error(result.detail || 'Error al cargar plantillas.');
                    
                    let modalContent = '<div class="modal-content"><h2 class="text-xl font-bold mb-4">Cargar Plantilla</h2><ul class="space-y-2">';
                    result.templates.forEach(name => {
                        modalContent += `<li><button class="template-item w-full text-left p-2 rounded hover:bg-gray-100" data-filename="${name}">${name}</button></li>`;
                    });
                    modalContent += '</ul><button onclick="closeModal()" class="mt-4 w-full p-2 bg-red-500 text-white rounded hover:bg-red-600">Cerrar</button></div>';
                    
                    templateModal.innerHTML = modalContent;
                    templateModal.classList.remove('hidden');
                    document.querySelectorAll('.template-item').forEach(btn => {
                        btn.onclick = () => loadTemplateContent(btn.dataset.filename);
                    });
                } catch (error) {
                    showStatus(error.message, 'red');
                }
            }

            window.closeModal = () => templateModal.classList.add('hidden');

            async function loadTemplateContent(filename) {
                const token = localStorage.getItem('access_token');
                if (!token) { return showStatus("Error de autenticación.", "red"); }
                try {
                    const response = await fetch(`/template-content/${filename}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!response.ok) throw new Error('No se pudo cargar el contenido.');
                    const content = await response.text();
                    const message = `CONTENIDO DE LA PLANTILLA: "${filename}"\n\n---\n\n${content}`;
                    userInput.value = message;
                    userInput.focus();
                    autoExpandTextarea(); // Llamar a la expansión después de cargar el contenido
                    closeModal();
                    showStatus(`Plantilla '${filename}' cargada en el área de texto.`, 'green');
                } catch (error) {
                    showStatus(error.message, 'red');
                }
            }

            // Esta función se mantiene igual, pero ahora usa el elemento textarea
            async function sendMessageToGemini(query, history = [], systemInstruction = "") {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    throw new Error("No autenticado");
                }

                const defaultPrompt = "Eres el asistente legal de STARCONTRACT. Tu tarea es redactar plantillas de documentos legales en texto plano, usando variables en formato {{nombre_de_variable}} que serán reemplazadas automáticamente por el sistema. Reglas obligatorias: 1. Sintaxis: Usa exactamente {{variable}} sin espacios ni otros símbolos. - Correcto: {{fecha_contrato}}, {{nombre_completo_cliente}} - Incorrecto: {{ nombre }}, {variable}, [variable], <<variable>> 2. Nombres de variables: En minúsculas, sin acentos, con guion bajo para compuestos. Ej: {{numero_de_identificacion}} 3. Formato: Usa respuestas en texto plano. Redacta como abogado colombiano con 30 años de experiencia. Finaliza con un llamado a visitar nuestros productos en starcontract.feee.nf"; 
                const systemPrompt = systemInstruction && systemInstruction.trim() ? systemInstruction.trim() : defaultPrompt;

                const payload = {
                    prompt: query,
                    history: history,
                    system_instruction: systemPrompt
                };

                const res = await fetch("/api/gemini", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    let errText = "Error en la API";
                    try {
                        const errJson = await res.json();
                        // Mostrar detalle legible si viene como objeto/array
                        if (errJson && errJson.detail) {
                            errText = typeof errJson.detail === 'string' ? errJson.detail : JSON.stringify(errJson.detail, null, 2);
                        } else {
                            errText = JSON.stringify(errJson, null, 2);
                        }
                    } catch (e) {
                        // si no viene JSON, intentar leer texto
                        try { errText = await res.text(); } catch {}
                    }
                    throw new Error(errText);
                }

                const data = await res.json();
                const candidate = data?.candidates?.[0];
                if (!candidate || !candidate.content?.parts?.[0]?.text) {
                    throw new Error("Respuesta de Gemini vacía");
                }
                return candidate.content.parts[0].text;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const userQuery = userInput.value.trim();
                if (!userQuery) return;
 
                displayMessage(userQuery, true);
                chatHistory.push({ role: 'user', parts: [{ text: userQuery }] });
                saveChatHistory();
                userInput.value = '';
                autoExpandTextarea(); // Volver a la altura inicial después de enviar
 
                const loadingMessage = document.createElement('div');
                loadingMessage.className = "bot-message self-start flex items-center space-x-2";
                loadingMessage.innerHTML = `<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>`;
                messagesContainer.appendChild(loadingMessage);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
 
                // Se elimina uso de instrucciones del sistema; se llama a la función con el historial únicamente
                const responseText = await sendMessageToGemini(userQuery, chatHistory.slice(0, -1));
                 
                messagesContainer.removeChild(loadingMessage);
                displayMessage(responseText, false);
                chatHistory.push({ role: 'model', parts: [{ text: responseText }] });
                saveChatHistory();
             });

            clearChatBtn.addEventListener('click', clearChat);
            exportChatBtn.addEventListener('click', exportChat);
            loadTemplateBtn.addEventListener('click', openTemplateModal);

            // Inicializar al cargar
            const restored = loadChatHistory();
            if (!restored) {
                clearChat();
            } else {
                showStatus("Conversación restaurada.", "green", 2000);
            }
            autoExpandTextarea(); // Asegurar la altura correcta al inicio

            // Añadir manejo de tecla Enter para enviar y Shift+Enter para nueva línea
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit', { cancelable: true }));
                }
            });
        });
    </script>
</body>
</html>
