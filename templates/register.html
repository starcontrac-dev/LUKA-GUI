<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Star-Doc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0d1117; --primary-text: #c9d1d9; --secondary-text: #8b949e; --border-color: #30363d; --accent-color: #58a6ff; --error-color: #f85149; --success-color: #3fb950; }
        html, body { height: 100%; }
        body { display: flex; align-items: center; justify-content: center; background-color: var(--bg-color); color: var(--primary-text); font-family: 'Roboto Mono', monospace; }
        .form-container { width: 100%; max-width: 480px; padding: 2rem; background-color: #161b22; border: 1px solid var(--border-color); border-radius: 6px; }
        h1 { font-family: 'Share Tech Mono', monospace; color: var(--accent-color); text-shadow: 0 0 5px var(--accent-color); text-align: center; margin-bottom: 1.5rem; }
        .form-control { background-color: var(--bg-color); color: var(--primary-text); border: 1px solid var(--border-color); }
        .form-control:focus { background-color: var(--bg-color); color: var(--primary-text); border-color: var(--accent-color); box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25); }
        .btn-primary { background-color: var(--accent-color); border-color: var(--accent-color); color: var(--bg-color); font-family: 'Share Tech Mono', monospace; }
        .alert { border-radius: 6px; }
        .alert-danger { background-color: rgba(248, 81, 73, 0.1); color: var(--error-color); border: 1px solid var(--error-color); }
        .alert-success { background-color: rgba(63, 185, 80, 0.1); color: var(--success-color); border: 1px solid var(--success-color); }
        .form-text a { color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="h3 mb-3 fw-normal">Registro de Nuevo Usuario</h1>
        <form id="register-form">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Nombre de Usuario" required>
                <label for="username">Nombre de Usuario</label>
            </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Nombre Completo" required>
                <label for="full_name">Nombre Completo</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                <label for="password">Contraseña</label>
            </div>
            <button class="w-100 btn btn-lg btn-primary" type="submit">Registrarse</button>
        </form>
        <div id="message-container" class="mt-3"></div>
        <p class="mt-3 text-center form-text"><a href="/">¿Ya tienes una cuenta? Inicia sesión</a></p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageContainer = document.getElementById('message-container');
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            messageContainer.innerHTML = '';

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    messageContainer.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    throw new Error(result.detail || 'Error en el registro.');
                }
            } catch (error) {
                messageContainer.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
