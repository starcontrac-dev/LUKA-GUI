<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de IA - STARCONTRACT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <style>
        /* Base */
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        .chat-container { 
            height: 100%; /* Asegura que el contenedor del chat ocupa todo el alto */
            width: 100%;  /* Asegura que el contenedor del chat ocupa todo el ancho */
            display: flex; 
            flex-direction: column; 
            border-radius: 0; /* Elimina el redondeo en modo pantalla completa */
            box-shadow: none; /* Elimina la sombra en modo pantalla completa */
        }
        .chat-header { background-color: #0d1117; border-bottom: 1px solid #30363d; color: white; }
        
        /* Scrollbar Styling (Mejora: Estilo de scrollbar más sutil) */
        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .messages-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Message Bubble Styles */
        .message { 
            max-width: 85%; 
            padding: 0.75rem 1rem; 
            border-radius: 1.5rem; 
            margin-bottom: 1rem; 
            position: relative; 
            animation: fadeIn 0.3s ease-out; 
            word-wrap: break-word; 
            filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.1)); /* Sombra ligera para mejor elevación */
        }
        .user-message { 
            background-color: #6366f1; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 0.5rem; 
        }
        .bot-message { 
            background-color: #f1f5f9; 
            color: #1e293b; 
            align-self: flex-start; 
            border-bottom-left-radius: 0.5rem; 
            /* Se ha eliminado el box-shadow redundante aquí, ya está en .message */
        }

        /* Markdown Content Styles */
        .bot-message pre { background-color: #1f2937; color: #d1d5db; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; margin-top: 0.75rem; margin-bottom: 0.75rem; }
        .bot-message code { font-family: 'Courier New', Courier, monospace; }
        .bot-message table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .bot-message th, .bot-message td { border: 1px solid #d1d5db; padding: 0.5rem; text-align: left; }
        .bot-message th { background-color: #e5e7eb; }
        .bot-message ul, .bot-message ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        .bot-message blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; color: #475569; margin: 0.75rem 0; font-style: italic; }

        /* Loading Dots */
        .loading-dot { width: 10px; height: 10px; background-color: #94a3b8; border-radius: 50%; display: inline-block; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .loading-dot:nth-child(3) { animation-delay: 0s; }
        
        /* Keyframes */
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Input Area and Textarea Enhancements (Mejora: Textarea de expansión automática más robusto) */
        #mic-btn.recording { color: #ef4444; }
        .chat-input-textarea {
            resize: none;
            min-height: 48px; 
            max-height: 200px; 
            font-size: 1rem;
            line-height: 1.5;
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
            transition: height 0.2s ease-out; 
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end; 
        }
        
        /* Estilo para el botón de enviar desactivado (Mejora: Retroalimentación visual cuando no se puede enviar) */
        #send-button[disabled] {
            cursor: not-allowed;
            background-color: #9ca3af; /* Gris sutil */
            transform: none !important;
            opacity: 0.8;
        }

        /* Media Queries */
        @media (max-width: 640px) {
            .chat-input-textarea { font-size: 1.02rem; padding-top: 0.6rem; padding-bottom: 0.6rem; }
            .chat-container { border-radius: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen"> <!-- CAMBIO 1: Eliminada la centralización flex y mantenida la altura/ancho completos -->

    <div class="chat-container bg-white overflow-hidden max-w-full w-full h-full"> <!-- CAMBIO 2: Eliminado el 'rounded-2xl', 'shadow-2xl', 'max-w-4xl' y 'md:h-[90vh]' -->
        <div class="chat-header p-4 flex items-center justify-between rounded-t-none"> <!-- CAMBIO 3: 'rounded-t-none' para consistencia -->
            <h1 class="text-xl font-bold flex items-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 4v-4z" /></svg>Asistente STARCONTRACT</h1>
            <div class="flex items-center space-x-4">
                <button type="button" id="export-chat-btn" title="Exportar conversación (Markdown)" class="text-gray-400 hover:text-white transition-colors p-1 rounded hover:bg-gray-700"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg></button>
                <button type="button" id="clear-chat-btn" title="Limpiar conversación" class="text-gray-400 hover:text-white transition-colors p-1 rounded hover:bg-gray-700"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
            </div>
        </div>
        <div id="messages" class="messages-container flex-1 p-6 overflow-y-auto flex flex-col space-y-4"></div>
        
        <!-- Contenedor del pie de página para el estado -->
        <div id="footer-status" class="p-2 border-t border-gray-200 bg-gray-50 flex justify-between items-center text-xs text-gray-500">
            <div id="status-message" class="transition-opacity duration-300"></div>
            <div id="key-hint" class="hidden md:block text-gray-400">
                Shift + Enter para nueva línea
            </div>
        </div>

        <form id="chat-form" class="p-4 border-t border-gray-200">
            <div class="input-wrapper relative">
                <textarea id="user-input" placeholder="Escribe tu pregunta..."
                    class="chat-input-textarea flex-1 w-full pl-4 pr-28 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
                    rows="1" required></textarea>
                
                <button type="button" id="mic-btn" title="Dictar por voz" class="absolute right-16 bottom-3 text-gray-500 hover:text-indigo-600 z-10 p-1 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg></button>
                <button type="submit" id="send-button" disabled class="absolute right-3 bottom-2 bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md active:scale-95 z-10"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg></button>
            </div>
        </form>
    </div>

    <script>
        // Funciones auxiliares para la conversión de texto a HTML y resaltado de código
        marked.setOptions({
            gfm: true,
            breaks: true, // Habilita saltos de línea suaves
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });
        
        // Función para codificar/decodificar Base64 de forma compatible con URL
        function base64UrlEncode(str) {
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // --- Inicio de la lógica del Chat ---

        document.addEventListener('DOMContentLoaded', () => {
            const messagesContainer = document.getElementById('messages');
            const form = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const statusMessage = document.getElementById('status-message');
            const sendButton = document.getElementById('send-button'); // Nuevo
            const clearChatBtn = document.getElementById('clear-chat-btn');
            const exportChatBtn = document.getElementById('export-chat-btn');
            const micBtn = document.getElementById('mic-btn');
            const welcomeMessage = "¡Hola! Soy el asistente de STARCONTRACT. ¿En qué puedo ayudarte hoy?";

            let chatHistory = [];
            let recognition;
            let isTyping = false; // Bandera para evitar envíos múltiples

            // Mejora 1: Gestión de entrada (Deshabilitar botón de envío si el campo está vacío)
            function checkInput() {
                const isEmpty = userInput.value.trim().length === 0;
                sendButton.disabled = isEmpty || isTyping; // Deshabilitar si está vacío o escribiendo
                if (isTyping) {
                    sendButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m15.356-2H15a8.001 8.001 0 00-4.008 8.411m-7.818 0A8.001 8.001 0 0115.418 15h.001m-4.35 4.35l4.35-4.35m0 0l-4.35-4.35" /></svg>`;
                } else {
                    sendButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>`;
                }
            }
            userInput.addEventListener('input', checkInput);

            // Función de auto-expansión mejorada
            function autoExpandTextarea() {
                userInput.style.height = 'auto';
                const newHeight = userInput.scrollHeight;
                const maxHeight = 200;
                if (newHeight > maxHeight) {
                    userInput.style.height = `${maxHeight}px`;
                    userInput.style.overflowY = 'auto';
                } else {
                    userInput.style.height = `${newHeight}px`;
                    userInput.style.overflowY = 'hidden';
                }
            }

            userInput.addEventListener('input', autoExpandTextarea);

            // Resto de funciones de manejo de historial y mensajes...
            function saveChatHistory() {
                try {
                    // Mejora 2: Uso de compresión Base64 para el almacenamiento local.
                    const compressedHistory = base64UrlEncode(JSON.stringify(chatHistory));
                    localStorage.setItem('chatHistory', compressedHistory);
                } catch (e) {
                    console.error('Error saving chat history:', e);
                }
            }

            function loadChatHistory() {
                try {
                    const stored = localStorage.getItem('chatHistory');
                    if (!stored || stored.length < 10) return false;
                    
                    let parsed;
                    try {
                        // Intenta decodificar Base64 (nuevo formato)
                        const decoded = atob(stored.replace(/-/g, '+').replace(/_/g, '/'));
                        parsed = JSON.parse(decoded);
                    } catch {
                        // Si falla, intenta parsear directamente (formato antiguo)
                        parsed = JSON.parse(stored);
                    }

                    if (!Array.isArray(parsed) || parsed.length === 0) return false;
                    chatHistory = parsed;
                    messagesContainer.innerHTML = '';
                    chatHistory.forEach(item => {
                        const text = item?.parts?.[0]?.text || '';
                        // Evita mostrar la bandera de "escribiendo" del bot si el historial tiene texto.
                        if (text.trim() !== '') { 
                            displayMessage(text, item.role === 'user', false); 
                        }
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    return true;
                } catch (e) {
                    console.error('Error loading chat history:', e);
                    localStorage.removeItem('chatHistory');
                    return false;
                }
            }
            
            // Función mejorada para crear botones de acción en mensajes del bot
            function createBotActionButtons(text) {
                const container = document.createElement('div');
                container.className = "flex space-x-2 mt-2 pt-2 border-t border-gray-200/50";
                
                // Botón Copiar (existente, pero mejorado visualmente)
                const copyBtn = document.createElement('button');
                copyBtn.title = "Copiar texto completo";
                copyBtn.className = "flex items-center text-xs text-gray-500 hover:text-indigo-600 transition-colors bg-white/50 px-2 py-1 rounded-full shadow-sm";
                copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>Copiar`;
                copyBtn.onclick = () => {
                    document.execCommand('copy', false, text); // Uso de execCommand para compatibilidad con iFrame
                    showStatus("Texto copiado.", 'green');
                };
                container.appendChild(copyBtn);

                // Mejora 3: Botón para "Reintentar" solo si es el último mensaje del bot
                if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'model') {
                    const retryBtn = document.createElement('button');
                    retryBtn.title = "Volver a generar respuesta";
                    retryBtn.className = "flex items-center text-xs text-gray-500 hover:text-red-600 transition-colors bg-white/50 px-2 py-1 rounded-full shadow-sm";
                    retryBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m15.356-2H15a8.001 8.001 0 00-4.008 8.411m-7.818 0A8.001 8.001 0 0115.418 15h.001m-4.35 4.35l4.35-4.35m0 0l-4.35-4.35" /></svg>Reintentar`;
                    retryBtn.onclick = async () => {
                        // Eliminar el último mensaje del usuario y del bot para reintentar
                        const lastUserQuery = chatHistory[chatHistory.length - 2]?.parts?.[0]?.text;
                        if (lastUserQuery) {
                            chatHistory.pop(); // Eliminar la respuesta del bot
                            chatHistory.pop(); // Eliminar la pregunta del usuario
                            messagesContainer.lastChild.remove(); // Eliminar la respuesta visual
                            messagesContainer.lastChild.remove(); // Eliminar la pregunta visual
                            
                            // Re-enviar la consulta
                            await submitQuery(lastUserQuery);
                            showStatus("Reintentando la generación de respuesta...", 'orange', 3000);
                        }
                    };
                    container.appendChild(retryBtn);
                }

                return container;
            }

            function displayMessage(text, isUser = false, runHighlight = true) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                const textDiv = document.createElement('div');
                
                if (isUser) {
                    textDiv.textContent = text;
                }
                else {
                    textDiv.innerHTML = marked.parse(text);
                    
                    // Solo añadir botones de acción si no es el mensaje de bienvenida
                    if (text !== welcomeMessage) {
                        messageDiv.appendChild(createBotActionButtons(text));
                    }
                }

                messageDiv.prepend(textDiv); // Usar prepend para que los botones queden después del texto
                
                messagesContainer.appendChild(messageDiv);
                
                // Mejora 4: Resaltado de código solo para bloques recién añadidos
                if (!isUser && runHighlight) {
                    const codeBlocks = messageDiv.querySelectorAll('pre code');
                    codeBlocks.forEach((block) => { hljs.highlightElement(block); });
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function showStatus(message, color, duration = 3000) {
                statusMessage.textContent = message;
                statusMessage.style.color = color;
                statusMessage.style.opacity = '1';
                if (duration > 0) {
                    setTimeout(() => { statusMessage.style.opacity = '0'; }, duration);
                }
            }

            function clearChat() {
                messagesContainer.innerHTML = '';
                chatHistory = [];
                localStorage.removeItem('chatHistory');
                displayMessage(welcomeMessage, false, false);
                userInput.value = '';
                autoExpandTextarea();
                checkInput(); // Asegurar que el botón esté deshabilitado
            }

            function exportChat() {
                const chatText = Array.from(messagesContainer.children).map(msg => {
                    // Ignorar el mensaje de bienvenida y los contenedores de carga
                    if (msg.classList.contains('bot-message') && msg.querySelector('div').textContent === welcomeMessage) return '';
                    if (msg.querySelector('.loading-dot')) return '';
                    
                    const isUser = msg.classList.contains('user-message');
                    const prefix = isUser ? '**Usuario:**' : '**Asistente:**';
                    
                    // Extraer solo el contenido de texto (el primer div es el contenido, ignorar los botones)
                    const contentElement = msg.querySelector('div');
                    const content = contentElement ? contentElement.textContent.trim() : '';

                    return content ? `${prefix}\n\n${content}` : '';
                }).filter(Boolean).join('\n\n---\n\n'); // Filtra líneas vacías

                const blob = new Blob([chatText], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chat-starcontract-${new Date().toISOString().slice(0,10)}.md`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus("Chat exportado en Markdown.", 'green');
            }

            // Lógica de Reconocimiento de Voz
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'es-CO';
                recognition.interimResults = true; // Mejora: interimResults a true para retroalimentación en tiempo real
                recognition.maxAlternatives = 1;

                micBtn.addEventListener('click', () => {
                    if (micBtn.classList.contains('recording')) {
                        recognition.stop();
                    } else {
                        try {
                            recognition.start();
                        } catch(e) {
                            showStatus("El reconocimiento de voz ya está activo.", "orange");
                        }
                    }
                });

                recognition.onstart = () => {
                    micBtn.classList.add('recording');
                    showStatus('Escuchando... Di algo.', '#6366f1', 0);
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    // Mejora 5: Mostrar la transcripción provisional en el input
                    userInput.value = finalTranscript + interimTranscript;
                    autoExpandTextarea();
                    checkInput();
                };

                recognition.onspeechend = () => recognition.stop();

                recognition.onend = () => {
                    micBtn.classList.remove('recording');
                    showStatus("", "");
                };

                recognition.onerror = (event) => {
                    const errorMsg = event.error == 'not-allowed' ? "Permiso de micrófono denegado." : `Error de voz: ${event.error}`;
                    showStatus(errorMsg, 'red', 10000);
                    micBtn.classList.remove('recording'); // Asegurar que el icono se restablezca
                };
            } else {
                micBtn.style.display = 'none';
            }
            
            // Función central para el envío
            async function submitQuery(userQuery) {
                isTyping = true;
                checkInput(); // Deshabilitar el botón y cambiarlo a spinner

                displayMessage(userQuery, true);
                chatHistory.push({ role: 'user', parts: [{ text: userQuery }] });
                saveChatHistory();
                userInput.value = '';
                autoExpandTextarea();

                const loadingMessage = document.createElement('div');
                loadingMessage.className = "bot-message self-start flex items-center space-x-2";
                loadingMessage.innerHTML = `<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>`;
                messagesContainer.appendChild(loadingMessage);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                let responseText = '';
                try {
                    // Simular retraso de red (Implementación de backoff omitida por simplicidad en un único archivo)
                    // await new Promise(resolve => setTimeout(resolve, 500)); 
                    responseText = await sendMessage(userQuery, chatHistory.slice(0, -1));
                } catch (e) {
                    responseText = `Error: ${e.message}`;
                } finally {
                    isTyping = false;
                    checkInput(); // Habilitar el botón nuevamente
                }
                
                // Remover el mensaje de carga antes de mostrar la respuesta
                if (messagesContainer.contains(loadingMessage)) {
                    messagesContainer.removeChild(loadingMessage);
                }

                displayMessage(responseText, false);
                chatHistory.push({ role: 'model', parts: [{ text: responseText }] });
                saveChatHistory();
            }

            async function sendMessage(prompt, history) {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    showStatus("Error de autenticación. Por favor, inicie sesión de nuevo.", "red");
                    throw new Error("No autenticado. Por favor, inicie sesión.");
                }

                // Mejora 6: Definición de un System Prompt más robusto (ya estaba bien, solo reubicado)
                const systemPrompt = "Eres un asistente de trading de criptomonedas para la empresa STARCONTRACT. Tienes acceso a la información de su página web https://starcontract.free.nf para responder preguntas sobre sus servicios, proyectos, y modelo de negocio. Tu función es proporcionar análisis de mercado, información sobre tendencias, y explicaciones claras sobre conceptos de trading, siempre manteniendo un tono profesional, informativo y útil. Proporciona información actualizada y relevante, citando tus fuentes, incluyendo la web de la empresa cuando corresponda. Por favor, utiliza el formato Markdown para tablas, listas y bloques de código para asegurar la correcta visualización y termina con un llamado a la accion para que visiten https://starcontract.free.nf ";

                const payload = { 
                    prompt: prompt,
                    history: history,
                    system_instruction: systemPrompt
                };

                // Lógica de fetch con manejo de errores... (mantenida igual)
                // ... (código de fetch y manejo de errores) ...
                try {
                    const response = await fetch("/api/gemini", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 401) {
                        localStorage.removeItem('access_token');
                        showStatus("Sesión expirada o inválida. Redirigiendo al login...", "red", 0);
                        setTimeout(() => { window.location.href = '/'; }, 2000);
                        throw new Error("No autorizado");
                    }

                    if (!response.ok) {
                        const errorData = await response.json();
                        console.error("Error from API:", errorData);
                        throw new Error(errorData.detail?.error?.message || errorData.detail || "Ocurrió un error en el servidor.");
                    }

                    const result = await response.json();
                    const candidate = result?.candidates?.[0];
                    if (!candidate || !candidate.content?.parts?.[0]?.text) {
                        throw new Error('Respuesta de la API inesperada o vacía.');
                    }
                    return candidate.content.parts[0].text;

                } catch (error) {
                    console.error('Error sending message:', error);
                    if (error.message === "No autorizado") {
                        // Mejorar el manejo del error de no autorizado para que no se muestre como mensaje del bot
                        throw new Error("No autorizado. Redirigiendo...");
                    }
                    throw new Error(`Ocurrió un error al procesar tu solicitud: ${error.message}`);
                }
            }

            // --- Event Listeners y Lógica Inicial ---

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const userQuery = userInput.value.trim();
                if (!userQuery || isTyping) return;
                
                await submitQuery(userQuery);
            });

            clearChatBtn.addEventListener('click', clearChat);
            exportChatBtn.addEventListener('click', exportChat);

            // Mejora 7: Soporte para Shift+Enter para nuevas líneas
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!userInput.value.trim() || isTyping) return;
                    form.dispatchEvent(new Event('submit', { cancelable: true }));
                }
            });

            // Lógica de carga inicial
            const restored = loadChatHistory();
            if (!restored) {
                clearChat();
            } else {
                showStatus("Conversación restaurada.", "green", 2000);
            }
            autoExpandTextarea();
            checkInput(); // Ejecutar checkInput al inicio
        });
    </script>
</body>
</html>
