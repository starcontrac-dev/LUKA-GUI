<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Star-Doc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --primary-text: #c9d1d9;
            --secondary-text: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-hover: #79c0ff;
            --error-color: #f85149;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            color: var(--primary-text);
            font-family: 'Roboto Mono', monospace;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        h1 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--accent-color);
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-control {
            background-color: var(--bg-color);
            color: var(--primary-text);
            border: 1px solid var(--border-color);
        }
        .form-control:focus {
            background-color: var(--bg-color);
            color: var(--primary-text);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25);
        }
        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--bg-color);
            font-family: 'Share Tech Mono', monospace;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .alert-danger {
            background-color: rgba(248, 81, 73, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="h3 mb-3 fw-normal">Star-Contract Login</h1>
        <form id="login-form">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
                <label for="username">Usuario</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password">Contraseña</label>
            </div>
            <button class="w-100 btn btn-lg btn-primary" type="submit">Iniciar Sesión</button>
        </form>
        <div id="error-container" class="mt-3"></div>
        <p class="mt-3 text-center form-text"><a href="/register-page">¿No tienes una cuenta? Regístrate</a></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorContainer = document.getElementById('error-container');
            const form = e.target;
            const formData = new FormData(form);
            const submitButton = form.querySelector('button[type="submit"]');
            errorContainer.innerHTML = '';
            submitButton.disabled = true;
            submitButton.textContent = 'Autenticando...';

            try {
                const tokenResponse = await fetch('/token', {
                    method: 'POST',
                    body: formData
                });

                if (!tokenResponse.ok) {
                    const errorData = await tokenResponse.json();
                    throw new Error(errorData.detail || 'Error de autenticación');
                }
                
                const tokenData = await tokenResponse.json();
                localStorage.setItem('access_token', tokenData.access_token);

                window.location.href = '/home';

            } catch (error) {
                console.error('Login error:', error);
                errorContainer.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
                submitButton.disabled = false;
                submitButton.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
